name: Windows Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 Build
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare directories.
        run: |
          if not exist "%GITHUB_WORKSPACE%\..\Libraries\win64" mkdir "%GITHUB_WORKSPACE%\..\Libraries\win64"
          if not exist "%GITHUB_WORKSPACE%\..\ThirdParty" mkdir "%GITHUB_WORKSPACE%\..\ThirdParty"
          echo TBUILD=%GITHUB_WORKSPACE%\..>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\..\Libraries\win64>>%GITHUB_ENV%

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$GITHUB_WORKSPACE/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          python -c "p = 'cmake/options_win.cmake'; c = open(p).read(); open(p, 'w').write(c.replace('$<IF:$<BOOL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>', '/DEBUG:NONE'))"

          echo "$(sha256sum $GITHUB_WORKSPACE/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/../Libraries/win64/*
            !${{ github.workspace }}/../Libraries/win64/cache_keys
            !${{ github.workspace }}/../Libraries/win64/[qQ]t[_-]*
            ${{ github.workspace }}/../Libraries/win64/cache_keys/*
            !${{ github.workspace }}/../Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/../Libraries/win64/[qQ]t[_-]*
            ${{ github.workspace }}/../Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt }}-

      - name: Libraries.
        run: |
          %GITHUB_WORKSPACE%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      - name: Save ThirdParty cache early.
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ github.workspace }}/../ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache early.
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ${{ github.workspace }}/../Libraries/win64/*
            !${{ github.workspace }}/../Libraries/win64/cache_keys
            !${{ github.workspace }}/../Libraries/win64/[qQ]t[_-]*
            ${{ github.workspace }}/../Libraries/win64/cache_keys/*
            !${{ github.workspace }}/../Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}

      - name: Save Qt cache early.
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ${{ github.workspace }}/../Libraries/win64/[qQ]t[_-]*
            ${{ github.workspace }}/../Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt }}-${{ env.CACHE_KEY }}

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="64Gram-custom-x64"
          GENERATOR="-G \"${{ matrix.generator }}\""
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV
          echo "TDESKTOP_BUILD_ARCH=" >> $GITHUB_ENV
          echo "TDESKTOP_BUILD_DEFINE=" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: |
          for dir in "$GITHUB_WORKSPACE/../Libraries/win64" "$GITHUB_WORKSPACE/../Libraries"; do
            if [ -d "$dir" ]; then
              find "$dir" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true
            fi
          done

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd /d %GITHUB_WORKSPACE%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT="" ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D TDESKTOP_DISABLE_SPELLCHECK=ON ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Release --parallel

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd /d %GITHUB_WORKSPACE%
          set OUT=%GITHUB_WORKSPACE%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact\64Gram.exe
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 14
